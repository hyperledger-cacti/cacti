# nginx front for the slim config store: publishes PostgREST under
# /rest/v1/ so the browser's supabase-js client works unchanged.
#
# CORS is wide open on purpose: the store holds no secrets in this
# profile (no auth, localhost deployment) and the browser origin is not
# knowable in advance (dev server :3001, custom deployments, ...).
server {
  listen 8000;

  add_header Access-Control-Allow-Origin "*" always;
  add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
  add_header Access-Control-Allow-Headers "*" always;
  add_header Access-Control-Max-Age "600" always;

  # Supabase REST surface (supabase-js hits ${url}/rest/v1/<table>).
  # Authorization is stripped on purpose: supabase-js always sends
  # `Bearer <key>`, and PostgREST without a JWT secret would reject it
  # (PGRST300). This profile has no auth - every request runs as the
  # anonymous role and any API key value is accepted.
  location /rest/v1/ {
    if ($request_method = OPTIONS) {
      return 204;
    }
    proxy_pass http://config-api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization "";
    # PostgREST emits its own ACAO; nginx adds ours above - hide the
    # upstream one so the browser never sees duplicate header values.
    proxy_hide_header Access-Control-Allow-Origin;
  }

  # Anything else (auth/v1, storage/v1, ...) is not part of the slim
  # profile: fail fast with a clear status instead of 404 body noise.
  location / {
    return 501 '{"message":"slim config profile: only /rest/v1/ is served"}';
  }
}
