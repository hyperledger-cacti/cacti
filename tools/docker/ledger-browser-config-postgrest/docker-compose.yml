# Slim self-hosted backend for the Cacti Ledger Browser.
#
# Replaces the ~15-service Supabase "all-in-one" image for local use with
# three small containers:
#   config-api       nginx publishing PostgREST under /rest/v1/ (port 8000)
#                    - the exact REST surface supabase-js talks to.
#   config-db        PostgreSQL holding gui_app_config / plugin_status,
#                    seeded with one example app instance (see init/01-init.sql).
#   example-gateway  canned SATP Hermes gateway responses (port 3013) so the
#                    UI shows real-looking sessions out of the box.
#
# Usage (from the repository root):
#   docker compose -f tools/docker/ledger-browser-config-postgrest/docker-compose.yml up -d
# Stop: docker compose -f tools/docker/ledger-browser-config-postgrest/docker-compose.yml down
#
# With this stack running, the ledger browser works with NO .env file: the
# built-in config default points at http://localhost:8000 and the slim
# profile ignores the API key (any non-empty value is accepted).
# Conflicts on ports 8000/5432 with the Supabase all-in-one container -
# run one or the other, not both.

services:
  config-db:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - config-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  config-api:
    restart: unless-stopped
    image: postgrest/postgrest:v12.2.3
    depends_on:
      config-db:
        condition: service_healthy
    environment:
      # No PGRST_JWT_SECRET on purpose: PostgREST then treats every request
      # as the anonymous role below and ignores Bearer/apikey headers, which
      # is exactly what a single-operator local profile wants.
      PGRST_DB_URI: postgres://authenticator:authenticator@config-db:5432/postgres
      PGRST_DB_ANON_ROLE: ledger_browser
      PGRST_DB_SCHEMAS: public
      PGRST_SERVER_PORT: "3000"

  config-gateway:
    restart: unless-stopped
    image: nginx:1.27-alpine
    depends_on:
      - config-api
    ports:
      - "8000:8000"
    volumes:
      - ./config-api-nginx.conf:/etc/nginx/conf.d/default.conf:ro

  example-gateway:
    restart: unless-stopped
    image: node:22-alpine
    working_dir: /srv
    command: node server.mjs
    ports:
      - "3013:3013"
    volumes:
      - ./example-gateway:/srv:ro

volumes:
  config-db-data:
