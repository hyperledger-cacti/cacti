syntax = "proto3";
package cacti.satp.v13.service;

import "cacti/satp/v13/common/message.proto";

// ── Lock Assertion Request (v13 Section 9.1) ───────────

message LockAssertionRequest {
  cacti.satp.v13.common.CommonSatp common = 1;
  cacti.satp.v13.common.LockAssertionClaim lock_assertion_claim = 2;
  cacti.satp.v13.common.LockAssertionClaimFormat lock_assertion_claim_format = 3;
  uint64 lock_assertion_expiration = 4;
  string hash_prev_message = 5;             
}

// ── Lock Assertion Response / Assertion Receipt (v13 Section 9.2) ──

message LockAssertionResponse {
  cacti.satp.v13.common.CommonSatp common = 1;
  string hash_prev_message = 2;             
}

service SatpStage2Service {
  rpc LockAssertion(LockAssertionRequest) returns (LockAssertionResponse) {}
}
