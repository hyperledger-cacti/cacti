syntax = "proto3";
package cacti.satp.v13.service;

import "cacti/satp/v13/common/message.proto";

// ── Transfer Proposal Request (v13 Section 8.3) ────────

message TransferProposalRequest {
  cacti.satp.v13.common.CommonSatp common = 1;
  cacti.satp.v13.common.TransferClaims transfer_init_claims = 2;
  cacti.satp.v13.common.TransferClaimsFormat transfer_init_claims_format = 3;
  cacti.satp.v13.common.NetworkCapabilities network_capabilities = 4;
}

// ── Transfer Proposal Response / Proposal Receipt (v13 Section 8.4) ──

message TransferProposalResponse {
  cacti.satp.v13.common.CommonSatp common = 1;
  string hash_transfer_init_claims = 2;     
  string timestamp = 3;
  string hash_prev_message = 4;             
}

// ── Transfer Commence Request (v13 Section 8.6) ────────

message TransferCommenceRequest {
  cacti.satp.v13.common.CommonSatp common = 1;
  string hash_transfer_init_claims = 2;     
  string hash_prev_message = 3;             
}

// ── Transfer Commence Response / ACK Commence (v13 Section 8.7) ──

message TransferCommenceResponse {
  cacti.satp.v13.common.CommonSatp common = 1;
  string hash_prev_message = 2;             
}

service SatpStage1Service {
  rpc TransferProposal(TransferProposalRequest) returns (TransferProposalResponse) {}
  rpc TransferCommence(TransferCommenceRequest) returns (TransferCommenceResponse) {}
}
