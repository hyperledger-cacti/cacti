<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/hyperledgerfavicon.webp" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cacti Ledger Browser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700;800&display=swap" rel="stylesheet" />

  <!--
    Runtime configuration: /config.js (same origin, hence allowed by the
    CSP's `script-src 'self'`) is a tiny static file that may assign
    window.__LEDGER_BROWSER_CONFIG__ = { ... } to override the build-time
    VITE_* values without rebuilding the bundle. It must stay a classic,
    non-deferred script placed BEFORE the bundle so the global exists when
    the bundle starts. Deploying without it is fine: the 404 is harmless
    and the app keeps using its build-time values (see
    src/main/typescript/common/runtime-config.ts and
    public/config.example.js).
  -->
  <script src="/config.js"></script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main/typescript/main.tsx"></script>
</body>

</html>
