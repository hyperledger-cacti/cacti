# nginx configuration for the Cacti Ledger Browser production image.
#
# Serves the vite-built static bundle with the same hardening as the
# development-tier `vite preview` headers (vite.config.mts), plus SPA
# routing, gzip and long
# asset caching. Runs as the unprivileged `nginx` user (see Dockerfile),
# hence the /tmp pid path and the 8080 listener.
#
# nginx `add_header` inheritance caveat: a location block that declares
# ANY `add_header` of its own does NOT inherit the server-level headers -
# that is why the security headers are repeated inside the /config.js and
# /assets/ locations (the ones that add Cache-Control).

user  nginx;
worker_processes  auto;
error_log  /dev/stderr notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Never disclose the nginx version in headers or error pages.
    server_tokens off;

    access_log  /dev/stdout;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # Compress the ~1.3 MB application chunk (~381 kB gzipped).
    gzip  on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    server {
        listen      8080;
        server_name _;
        root   /usr/share/nginx/html;
        index  index.html;

        # Round-4 hardening headers (keep in sync with vite.config.mts):
        # - `script-src 'self'`: the bundle has no inline scripts; the
        #   runtime /config.js is same-origin, so it stays covered.
        # - `style-src 'unsafe-inline'` is required by MUI/emotion and
        #   apexcharts, which inject <style> elements at runtime.
        # - `connect-src 'self' http: https:`: Supabase, SATP gateway and
        #   Prometheus endpoints are runtime-configured (per app instance
        #   or via /config.js), so origins cannot be pinned at deploy time.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' http: https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        # Runtime configuration file: operators edit /config.js to retarget
        # environments, so it must never be cached.
        location = /config.js {
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' http: https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Cache-Control "no-store" always;
        }

        # Content-hashed bundle assets are immutable - cache hard.
        location /assets/ {
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' http: https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # SPA fallback: client-side routes (/satp/..., /eth/...) must
        # resolve to the application shell.
        location / {
            try_files $uri /index.html;
        }
    }
}
