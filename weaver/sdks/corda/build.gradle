import static org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
import static org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_9

buildscript {
    Properties constants = new Properties()
    file("$projectDir/./constants.properties").withInputStream { constants.load(it) }
    
    ext {
        kotlin_version = constants.getProperty("kotlinVersion")
        coroutines_version = constants.getProperty("coroutinesVersion")
        bcprov_version = constants.getProperty("bcprovVersion")
        bcprov_name = constants.getProperty("bcprovName")
        grpc_version = constants.getProperty("grpcVersion") // CURRENT_GRPC_VERSION
        grpc_kotlin_version = constants.getProperty("grpcKotlinVersion") // CURRENT_GRPC_KOTLIN_VERSION
        corda_release_group = constants.getProperty("cordaReleaseGroup")
        corda_core_release_group = constants.getProperty("cordaReleaseGroup")
        corda_version = constants.getProperty("cordaVersion")
        corda_core_version = constants.getProperty("cordaVersion")
        arrow_version = constants.getProperty("arrowVersion")
        log4j_version = constants.getProperty("log4jVersion")
        slf4j_version = constants.getProperty("slf4jVersion")
        cacti_version = constants.getProperty("cactiVersion")
    }
    
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

plugins {
    id "java-library"
    id 'org.jetbrains.dokka' version '0.10.1'
    id "maven-publish"
    id "jacoco"
}

apply plugin: "kotlin"

sourceSets {
    main {
        java.srcDirs += 'src/main/kotlin/'
        kotlin.srcDirs += 'src/main/kotlin/'
    }
}

Properties constants = new Properties()

repositories {
    maven { url 'https://repo1.maven.org/maven2' }
    maven { url 'https://download.corda.net/maven/corda-releases' }
    maven { url 'https://download.corda.net/maven/corda-dependencies' }
    if (file("$projectDir/./github.properties").exists()) {
        file("$projectDir/github.properties").withInputStream { constants.load(it) }
        maven {
            url	constants.url
            credentials {
                username constants.username
                password constants.password
            }
        }
    }
    else {
        flatDir {
            dirs '../../core/network/corda-interop-app/interop-contracts/build/libs'
            dirs '../../core/network/corda-interop-app/interop-workflows/build/libs'
            dirs '../../common/protos-java-kt/build/libs'
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    implementation 'com.google.code.gson:gson:2.8.6'

    // Corda dependencies.
    implementation "$corda_core_release_group:corda-core:$corda_core_version"
    implementation "$corda_release_group:corda-node-api:$corda_version"
    implementation "$corda_release_group:corda:$corda_version"
    implementation "$corda_release_group:corda-rpc:$corda_version"

    implementation(group: 'org.hyperledger.cacti.weaver.imodule.corda', name: 'interop-contracts', version: "$cacti_version")
    implementation(group: 'org.hyperledger.cacti.weaver.imodule.corda', name: 'interop-workflows', version: "$cacti_version")
    implementation(group: 'org.hyperledger.cacti.weaver.protos', name: 'protos-java-kt', version: "$cacti_version")

    // gRPC dependencies
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"
    implementation "io.grpc:grpc-kotlin-stub:$grpc_kotlin_version"
    implementation "io.grpc:grpc-netty-shaded:$grpc_version"
    implementation "io.grpc:grpc-stub:$grpc_version"
    implementation "io.grpc:grpc-okhttp:$grpc_version"
    implementation "io.grpc:grpc-protobuf:$grpc_version"
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53' // necessary for Java 9+
    implementation "org.bouncycastle:$bcprov_name:$bcprov_version"
    implementation group: 'org.json', name: 'json', version: '20190722'
    
    // Logger dependencies
    implementation "org.apache.logging.log4j:log4j-slf4j-impl:${log4j_version}"
    implementation "org.apache.logging.log4j:log4j-web:${log4j_version}"
    implementation "org.slf4j:jul-to-slf4j:$slf4j_version"
    implementation "org.slf4j:slf4j-simple:$slf4j_version"

    // Unit test dependencies (JUnit 5 / Jupiter). gson and bouncycastle are already on the
    // main classpath and are inherited by the test source set.
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.2"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"

}


tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile) {
    compilerOptions {
        languageVersion = KOTLIN_1_9
        apiVersion = KOTLIN_1_9
        jvmTarget = JVM_17
        javaParameters = true
    }
}


java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

compileJava {
    options.compilerArgs << '-parameters'
}

dokka {
    outputFormat = 'html'
    outputDirectory = "$buildDir/dokka"
}

jar {
    // This makes the JAR's SHA-256 hash repeatable.
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

publishing {
    // Handling if github.properties is not specified
    if (!file("$projectDir/./github.properties").exists()) {
        def styler = 'black red green yellow blue magenta cyan white'
                .split().toList().withIndex(30)
                .collectEntries { key, val -> [(key) : { "\033[${val}m${it}\033[0m" }] }
        println "${styler['red']('Warning')}: Publish won't work. Please use github.properties.template to create github.properties"
    }
    publications {
        sdk(MavenPublication) {
            groupId = project.properties['group']
            artifactId = project.properties['name']
            version = project.properties['version']
            from components.java
        }
    }
    repositories {
        maven {
            url constants.url
            credentials {
                username constants.username
                password constants.password
            }
        }
    }
}

tasks.test {
    useJUnitPlatform()
    // Always re-run so results are logged every time, instead of Gradle reporting the
    // task UP-TO-DATE and printing nothing.
    outputs.upToDateWhen { false }
    testLogging {
        // One line per test: name + passed/skipped/failed.
        events("passed", "skipped", "failed")
        // No stdout noise for passing tests; only failures print debugging detail
        // (assertion message + full stack trace).
        showStandardStreams = false
        exceptionFormat = "full"
        showCauses = true
        showStackTraces = true
    }
    // Log everything to the console; drop the HTML report.
    reports {
        html.required = false
    }
    // Generate the coverage report right after the tests run.
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    // No HTML/XML on disk; we only need the CSV to parse and print a summary to the log.
    reports {
        html.required = false
        xml.required = false
        csv.required = true
    }
    doLast {
        def csv = reports.csv.outputLocation.get().asFile
        if (!csv.exists()) {
            println "\n[coverage] no report generated (${csv})"
            return
        }
        def pct = { covered, missed ->
            def total = covered + missed
            total == 0 ? "n/a" : String.format("%.1f%% (%d/%d)", 100.0 * covered / total, covered, total)
        }
        int insMissed = 0, insCovered = 0, brMissed = 0, brCovered = 0, lnMissed = 0, lnCovered = 0
        // JaCoCo CSV columns: GROUP,PACKAGE,CLASS,
        //   INSTRUCTION_MISSED(3),INSTRUCTION_COVERED(4),BRANCH_MISSED(5),BRANCH_COVERED(6),
        //   LINE_MISSED(7),LINE_COVERED(8),...
        csv.readLines().drop(1).each { row ->
            def c = row.split(',')
            insMissed += c[3] as int; insCovered += c[4] as int
            brMissed  += c[5] as int; brCovered  += c[6] as int
            lnMissed  += c[7] as int; lnCovered  += c[8] as int
            if (c[2] == "CredentialsExtractor") {
                println "\n[coverage] CredentialsExtractor -> lines ${pct(c[8] as int, c[7] as int)}, " +
                        "branches ${pct(c[6] as int, c[5] as int)}, instructions ${pct(c[4] as int, c[3] as int)}"
            }
        }
        println "[coverage] TOTAL -> lines ${pct(lnCovered, lnMissed)}, " +
                "branches ${pct(brCovered, brMissed)}, instructions ${pct(insCovered, insMissed)}\n"
    }
}
