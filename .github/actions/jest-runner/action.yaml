name: Jest Runner action
description: "Run Jest tests with optional code coverage"

inputs:
  run_code_coverage:
    description: "Whether to run tests with code coverage, 'true' or 'false'"
    required: true
  jest_test_pattern:
    description: "The Jest test pattern to run, e.g. 'packages/cactus-api-client/src/test/typescript/(unit|integration|benchmark)/.*/*.test.ts'"
    required: true
  jest_test_coverage_path:
    description: "The path to output Jest code coverage reports to, e.g. './code-coverage-ts/cactus-api-client'"
    required: false
  report_name:
    description: "The name of the report"
    required: false
    default: "jest-tests-report"
  jest_test_ignore:
    description: >-
      Regex of test paths to skip, passed through as --testPathIgnorePatterns.
      NOTE: this REPLACES the list in jest.config.js rather than adding to it,
      so only use it for patterns under the caller's own jest_test_pattern.
    required: false
    default: ""
  jest_test_timeout:
    description: >-
      Per-test timeout in milliseconds, passed through as --testTimeout.
      Leave empty to use the repo-wide jest.config.js value (1 hour).
      NOTE: jest applies this to hooks as well, so it must stay above the
      time a suite's beforeAll needs (a Fabric AIO ledger takes ~4 minutes).
    required: false
    default: ""
  github_secret:
    description: "GitHub secret for authentication"
    required: false

runs:
  using: "composite"
  steps:
    - name: Run Jest Tests (with coverage)
      if: ${{ inputs.run_code_coverage == 'true' }}
      shell: bash
      run: |
        mkdir -p reports
        export JEST_JUNIT_OUTPUT_FILE="reports/${{ inputs.report_name }}.xml"
        yarn jest "${{ inputs.jest_test_pattern }}" \
          ${{ inputs.jest_test_timeout && format('--testTimeout={0}', inputs.jest_test_timeout) || '' }} \
          ${{ inputs.jest_test_ignore && format('--testPathIgnorePatterns={0}', inputs.jest_test_ignore) || '' }} \
          --coverage \
          --coverageDirectory="${{ inputs.jest_test_coverage_path }}" \
          --reporters=default \
          --reporters=jest-junit \
          --passWithNoTests \
          --forceExit

    - name: Run Jest Tests (without coverage)
      if: ${{ inputs.run_code_coverage != 'true' }}
      shell: bash
      run: |
        mkdir -p reports
        export JEST_JUNIT_OUTPUT_FILE="reports/${{ inputs.report_name }}.xml"
        yarn jest "${{ inputs.jest_test_pattern }}" \
          ${{ inputs.jest_test_timeout && format('--testTimeout={0}', inputs.jest_test_timeout) || '' }} \
          ${{ inputs.jest_test_ignore && format('--testPathIgnorePatterns={0}', inputs.jest_test_ignore) || '' }} \
          --reporters=default \
          --reporters=jest-junit \
          --passWithNoTests \
          --forceExit

    - name: Report Jest test results
      if: >
        always() &&
        inputs.github_secret != '' &&
        github.event.pull_request.head.repo.fork != true
      uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 #v3.0.0
      with:
        name: "${{ inputs.report_name }}"
        path: "reports/${{ inputs.report_name }}.xml"
        reporter: jest-junit
        max-annotations: 0
        token: ${{ inputs.github_secret }}
        fail-on-error: false
        fail-on-empty: false
        only-summary: false
        list-suites: failed
        list-tests: failed
        path-replace-backslashes: false
