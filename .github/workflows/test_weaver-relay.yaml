name: Unit Test Relay

on:
  workflow_call:
    inputs:
      run_all:
        required: true
        type: string

concurrency:
  group: relay-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  check_code_changed:
    outputs:
      relay_changed: ${{ steps.changes.outputs.relay_changed }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 #v4.0.2
        id: changes
        with:
          filters: |
            relay_changed:
              - './weaver/common/protos/**'
              - './weaver/common/protos-rs/**'
              - './weaver/core/relay/**'
              - '.github/workflows/test_weaver-relay.yaml'

  unit_test_relay_local:
    needs: check_code_changed
    if:  inputs.run_all == 'true' || needs.check_code_changed.outputs.relay_changed == 'true'
    runs-on: ubuntu-22.04
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Install RUST Toolchain minimal stable with clippy and rustfmt
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af #v1.0.7
        with:
          profile: minimal
          toolchain: stable
          components: rustfmt, clippy

      - name: Use Protoc 3.15
        run: |
          curl -LO https://github.com/protocolbuffers/protobuf/releases/download/v3.15.6/protoc-3.15.6-linux-x86_64.zip
          unzip protoc-3.15.6-linux-x86_64.zip -d protoc

      - name: Build Protos RS
        run: |
          export PATH="$PATH:${GITHUB_WORKSPACE}/protoc/bin"
          make build
        working-directory: weaver/common/protos-rs

      - name: Get Latest Relay Dependencies
        run: |
          make protos-local
          cargo update -p nom
          cargo update -p lexical-core
        working-directory: weaver/core/relay

      - name: Build Image
        run: make
        working-directory: weaver/core/relay

      - name: Run Dummy Relay
        run: RELAY_CONFIG=config/Dummy_Relay.toml  cargo run --bin server &> relay-dummy.out &
        working-directory: weaver/core/relay

      - name: Run Dummy Driver
        run: RELAY_CONFIG=config/Dummy_Relay.toml  cargo run --bin dummy-driver &> driver-dummy.out &
        working-directory: weaver/core/relay

      - name: Mock Client Test
        run: |
            echo "Waiting for Dummy Relay and Driver to come up"
            sleep 30
            cargo run --bin client 9085 localhost:9085/Dummy_Network/abc:abc:abc:abc
        working-directory: weaver/core/relay

  unit_test_relay_tls_local:
    needs: check_code_changed
    if:  inputs.run_all == 'true' || needs.check_code_changed.outputs.relay_changed == 'true'
    runs-on: ubuntu-22.04
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Install RUST Toolchain minimal stable with clippy and rustfmt
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af #v1.0.7
        with:
          profile: minimal
          toolchain: stable
          components: rustfmt, clippy

      - name: Use Protoc 3.15
        run: |
          curl -LO https://github.com/protocolbuffers/protobuf/releases/download/v3.15.6/protoc-3.15.6-linux-x86_64.zip
          unzip protoc-3.15.6-linux-x86_64.zip -d protoc

      - name: Build Protos RS
        run: |
          export PATH="$PATH:${GITHUB_WORKSPACE}/protoc/bin"
          make build
        working-directory: weaver/common/protos-rs

      - name: Get Latest Relay Dependencies
        run: |
          make protos-local
          cargo update -p nom
          cargo update -p lexical-core
        working-directory: weaver/core/relay

      - name: Build Image
        run: make
        working-directory: weaver/core/relay

      - name: Run Dummy Relay
        run: RELAY_CONFIG=config/Dummy_Relay_tls.toml cargo run --bin server &> relay-dummy.out &
        working-directory: weaver/core/relay

      - name: Run Dummy Driver
        run: RELAY_CONFIG=config/Dummy_Relay_tls.toml cargo run --bin dummy-driver &> driver-dummy.out &
        working-directory: weaver/core/relay

      - name: Mock Client Test
        run: |
            echo "Waiting for Dummy Relay and Driver to come up"
            sleep 30
            cargo run --bin client-tls 9085 localhost:9085/Dummy_Network/abc:abc:abc:abc
        working-directory: weaver/core/relay

  unit_test_relay:
    needs: check_code_changed
    if: ${{ vars.ENABLE_PACKAGES_CI == 'true' && needs.check_code_changed.outputs.relay_changed == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Install RUST Toolchain minimal stable with clippy and rustfmt
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af #v1.0.7
        with:
          profile: minimal
          toolchain: stable
          components: rustfmt, clippy

      - name: Get Latest Relay Dependencies
        run: |
          cargo update -p nom
          cargo update -p lexical-core
        working-directory: weaver/core/relay

      - name: Build Image
        run: make build
        working-directory: weaver/core/relay

      - name: Run Dummy Relay
        run: RELAY_CONFIG=config/Dummy_Relay.toml  cargo run --bin server &> relay-dummy.out &
        working-directory: weaver/core/relay

      - name: Run Dummy Driver
        run: RELAY_CONFIG=config/Dummy_Relay.toml  cargo run --bin dummy-driver &> driver-dummy.out &
        working-directory: weaver/core/relay

      - name: Mock Client Test
        run: |
            echo "Waiting for Dummy Relay and Driver to come up"
            sleep 30
            cargo run --bin client 9085 localhost:9085/Dummy_Network/abc:abc:abc:abc
        working-directory: weaver/core/relay

  unit_test_relay_tls:
    needs: check_code_changed
    if: ${{ vars.ENABLE_PACKAGES_CI == 'true' && needs.check_code_changed.outputs.relay_changed == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Install RUST Toolchain minimal stable with clippy and rustfmt
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af #v1.0.7
        with:
          profile: minimal
          toolchain: stable
          components: rustfmt, clippy

      - name: Get Latest Relay Dependencies
        run: |
          cargo update -p nom
          cargo update -p lexical-core
        working-directory: weaver/core/relay

      - name: Build Image
        run: make build
        working-directory: weaver/core/relay

      - name: Run Dummy Relay
        run: RELAY_CONFIG=config/Dummy_Relay_tls.toml cargo run --bin server &> relay-dummy.out &
        working-directory: weaver/core/relay

      - name: Run Dummy Driver
        run: RELAY_CONFIG=config/Dummy_Relay_tls.toml cargo run --bin dummy-driver &> driver-dummy.out &
        working-directory: weaver/core/relay

      - name: Mock Client Test
        run: |
            echo "Waiting for Dummy Relay and Driver to come up"
            sleep 30
            cargo run --bin client-tls 9085 localhost:9085/Dummy_Network/abc:abc:abc:abc
        working-directory: weaver/core/relay

  # Single rollup gate for all jobs above. Branch protection requires ONLY this
  # context instead of the individual job contexts, so a job that legitimately
  # skips (paths-filter found no relevant change) does not leave a required
  # check pending forever. `if: always()` makes it always report a status; a
  # `skipped` dependency is treated as passing, only `failure`/`cancelled` fail.
  relay-success:
    needs:
      - check_code_changed
      - unit_test_relay_local
      - unit_test_relay_tls_local
      - unit_test_relay
      - unit_test_relay_tls
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    steps:
      - name: Report status of all jobs
        run: |
          echo "Status of upstream jobs:"
          echo "  check_code_changed        = ${{ needs.check_code_changed.result }}"
          echo "  unit_test_relay_local     = ${{ needs.unit_test_relay_local.result }}"
          echo "  unit_test_relay_tls_local = ${{ needs.unit_test_relay_tls_local.result }}"
          echo "  unit_test_relay           = ${{ needs.unit_test_relay.result }}"
          echo "  unit_test_relay_tls       = ${{ needs.unit_test_relay_tls.result }}"
      - name: Fail if any job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::One or more jobs failed or were cancelled."
          exit 1
      - name: All jobs passed
        run: echo "All jobs succeeded or were skipped."
