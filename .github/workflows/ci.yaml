name: Cacti CI
on:
  pull_request:
    branches:
      - main
      - dev

  workflow_dispatch:
    inputs:
      ec2_runner_count:
        description: Temporary EC2 runners to start (0 = GitHub-hosted only; empty = vars.EC2_RUNNER_COUNT)
        default: ""
      ec2_instance_type:
        description: EC2 instance type for the temporary runners (empty = vars.EC2_INSTANCE_TYPE)
        default: ""

  schedule:
    # Run at 8:00 AM UTC on weekends (Monday and Thursday)
    - cron: "0 8 * * 1,4" 

env:
  NODEJS_VERSION: v20.20.0
  RUN_TRIVY_SCAN: true
  RUN_CODE_COVERAGE: true
  NODE_OPTIONS: --max-old-space-size=8192

# Top-level cap for every reusable workflow called from this file.
# Must be >= the union of all transitively reachable job-level scopes.
# `contents: write` is required by `cpl-connector-besu` (connector-packages)
# and `cactus-cmd-api-server` (core-packages) because they push benchmark
# results to the gh-pages branch on main and write commit-comment alerts.
# Least-privilege default; jobs that call reusable workflows needing more
# declare their own permissions block (which caps the called workflow).
permissions:
  contents: read

jobs:
  env-setup:
    outputs:
      node_version: ${{ steps.set-node-version.outputs.node_version }}
      run_code_coverage: ${{ steps.set-run-code-coverage.outputs.run_code_coverage }}
      run_trivy_scan: ${{ steps.set-run-trivy-scan.outputs.run_trivy_scan }}
    runs-on: ubuntu-22.04
    steps:
      - name: Set Node Version Output
        id: set-node-version
        run: echo "node_version=${{ env.NODEJS_VERSION }}" >> "$GITHUB_OUTPUT"
      - name: Set Run Code Coverage Output
        id: set-run-code-coverage
        run: echo "run_code_coverage=${{ env.RUN_CODE_COVERAGE }}" >> "$GITHUB_OUTPUT"
      - name: Set Run Trivy Scan Output
        id: set-run-trivy-scan
        run: echo "run_trivy_scan=${{ env.RUN_TRIVY_SCAN }}" >> "$GITHUB_OUTPUT"

  # Temporary EC2 runners for the package test workflows, started in
  # parallel with checks-and-build. See ec2-runners-start.yaml for the
  # repository variables that enable them; without them runs_on falls back
  # to ubuntu-22.04 and nothing changes.
  start-ec2-runners:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ec2-runners-start.yaml
    with:
      # Runners are single-use, so this must cover every job the package and
      # ghcr workflows dispatch (about 75 when all packages are affected).
      runner_count: ${{ inputs.ec2_runner_count || vars.EC2_RUNNER_COUNT_CACTI_CI }}
      instance_type: ${{ inputs.ec2_instance_type }}
    secrets:
      EC2_RUNNER_GITHUB_TOKEN: ${{ secrets.EC2_RUNNER_GITHUB_TOKEN }}

  checks-and-build:
    needs: [env-setup]
    uses: ./.github/workflows/checks-and-build.yaml
    with:
      node_version: ${{ needs.env-setup.outputs.node_version }}
    
  code-quality-checks:
    needs: [checks-and-build, env-setup]
    uses: ./.github/workflows/code-quality-checks.yaml
    with:
      node_version: ${{ needs.env-setup.outputs.node_version }}
      
  packages-workflow:
    needs: [checks-and-build, env-setup, start-ec2-runners]
    # core-packages/connector-packages push benchmark data to gh-pages on main.
    permissions:
      contents: write
      actions: read
      checks: write
    uses: ./.github/workflows/packages-workflow.yaml
    with:
      affected-packages: ${{ needs.checks-and-build.outputs.affected_packages }}
      node_version: ${{ needs.env-setup.outputs.node_version }}
      run_code_coverage: ${{ needs.env-setup.outputs.run_code_coverage }}
      run_trivy_scan: ${{ needs.env-setup.outputs.run_trivy_scan }}
      runs_on: ${{ needs.start-ec2-runners.outputs.runs_on }}

  ghcr-workflow:
    needs: [checks-and-build, env-setup, start-ec2-runners]
    uses: ./.github/workflows/ghcr-workflow.yaml
    with:
      node_version: ${{ needs.env-setup.outputs.node_version }}
      run_trivy_scan: ${{ needs.env-setup.outputs.run_trivy_scan }}
      affected-packages: ${{ needs.checks-and-build.outputs.affected_packages }}
      runs_on: ${{ needs.start-ec2-runners.outputs.runs_on }}

  # Terminate the instances whatever happened to the tests.
  stop-ec2-runners:
    needs: [start-ec2-runners, packages-workflow, ghcr-workflow]
    if: ${{ always() }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ec2-runners-stop.yaml
    with:
      ec2_enabled: ${{ needs.start-ec2-runners.outputs.ec2_enabled }}
      ec2_indexes: ${{ needs.start-ec2-runners.outputs.ec2_indexes }}
    secrets:
      EC2_RUNNER_GITHUB_TOKEN: ${{ secrets.EC2_RUNNER_GITHUB_TOKEN }}

