# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Unit Test Corda Packages

on:
  workflow_call:
    inputs:
      run_all:
        required: true
        type: string
    

concurrency:
  group: corda-pkg-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  check_code_changed:
    outputs:
      interop_cordapp_changed: ${{ steps.changes.outputs.interop_cordapp_changed }}
      corda_sdk_changed: ${{ steps.changes.outputs.corda_sdk_changed }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 #v4.0.2
        id: changes
        with:
          filters: |
            interop_cordapp_changed:
              - './weaver/common/protos-java-kt/**'
              - './weaver/core/network/corda-interop-app/**'
              - '.github/workflows/test_weaver-corda-pkgs.yaml'
            corda_sdk_changed:
              - './weaver/common/protos-java-kt/**'
              - './weaver/core/network/corda-interop-app/**'
              - './weaver/sdks/corda/**'
              - '.github/workflows/test_weaver-corda-pkgs.yaml'

  unit_test_interop_cordapp:
    needs: check_code_changed
    if:  inputs.run_all == 'true' || needs.check_code_changed.outputs.interop_cordapp_changed == 'true'
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

    - name: Set up JDK 17
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 #v5.6.0
      with:
        java-version: '17'
        distribution: 'adopt'

    - name: Build Protos (Local)
      run: make build
      working-directory: weaver/common/protos-java-kt

    - name: Build Corda Interop App (Local)
      run: make build-local
      working-directory: weaver/core/network/corda-interop-app

    - name: Run Tests (Local)
      run: make test
      working-directory: weaver/core/network/corda-interop-app

  unit_test_corda_sdk:
    needs: check_code_changed
    if:  inputs.run_all == 'true' || needs.check_code_changed.outputs.corda_sdk_changed == 'true'
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

    - name: Set up JDK 17
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 #v5.6.0
      with:
        java-version: '17'
        distribution: 'adopt'

    - name: Build Protos (Local)
      run: make build
      working-directory: weaver/common/protos-java-kt

    - name: Build Corda Interop App (Local)
      run: make build-local
      working-directory: weaver/core/network/corda-interop-app
    
    - name: Build Corda SDK (Local)
      run: make build
      working-directory: weaver/sdks/corda
    
    - name: Run Corda SDK Tests (Local)
      run: make test
      working-directory: weaver/sdks/corda

  # Single rollup gate for all jobs above. Branch protection requires ONLY this
  # context instead of the individual job contexts, so a job that legitimately
  # skips (paths-filter found no relevant change) does not leave a required
  # check pending forever. `if: always()` makes it always report a status; a
  # `skipped` dependency is treated as passing, only `failure`/`cancelled` fail.
  corda-pkgs-success:
    needs:
      - check_code_changed
      - unit_test_interop_cordapp
      - unit_test_corda_sdk
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    steps:
      - name: Report status of all jobs
        run: |
          echo "Status of upstream jobs:"
          echo "  check_code_changed        = ${{ needs.check_code_changed.result }}"
          echo "  unit_test_interop_cordapp = ${{ needs.unit_test_interop_cordapp.result }}"
          echo "  unit_test_corda_sdk       = ${{ needs.unit_test_corda_sdk.result }}"
      - name: Fail if any job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::One or more jobs failed or were cancelled."
          exit 1
      - name: All jobs passed
        run: echo "All jobs succeeded or were skipped."
