name: Stop temporary EC2 runners

# Reusable counterpart of ec2-runners-start.yaml. Call it with `if: always()`
# so every instance is terminated even when the tests failed or the run was
# cancelled. A leg whose start failed has no artifact and is skipped.

on:
  workflow_call:
    inputs:
      ec2_enabled:
        required: true
        type: string
      ec2_indexes:
        description: JSON array of matrix indexes from ec2-runners-start.yaml
        required: true
        type: string
    secrets:
      EC2_RUNNER_GITHUB_TOKEN:
        required: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}

jobs:
  stop:
    if: ${{ inputs.ec2_enabled == 'true' }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        index: ${{ fromJSON(inputs.ec2_indexes) }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        id: handle
        continue-on-error: true
        with:
          name: ec2-runner-start-${{ matrix.index }}
          path: ec2-runner/
      - name: Read runner handle
        id: read
        if: ${{ steps.handle.outcome == 'success' }}
        run: |
          {
            echo "label=$(cat ec2-runner/label)"
            echo "instance_id=$(cat ec2-runner/instance-id)"
          } >> "$GITHUB_OUTPUT"
      - name: Configure AWS credentials
        if: ${{ steps.read.outputs.instance_id != '' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Stop EC2 runner
        if: ${{ steps.read.outputs.instance_id != '' }}
        uses: machulav/ec2-github-runner@343a1b2ae682e681c3cec9a235d882da17ff04ef # v2.6.1
        with:
          mode: stop
          github-token: ${{ secrets.EC2_RUNNER_GITHUB_TOKEN }}
          label: ${{ steps.read.outputs.label }}
          ec2-instance-id: ${{ steps.read.outputs.instance_id }}
